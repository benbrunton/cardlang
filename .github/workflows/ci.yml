name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # installs the version pinned in rust-toolchain.toml
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

      - name: Check example games parse
        run: |
          cargo run --quiet -- test examples/race.card
          cargo run --quiet -- test examples/turns.card
          cargo run --quiet -- test examples/simple_scopa.card
          cargo run --quiet -- test examples/scopa.card

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  editor-grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Test the VS Code grammar
        run: npm test
